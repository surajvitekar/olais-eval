# Olais Eval — Nginx Reverse Proxy Configuration
# Handles SSL termination, static caching, gzip, security headers,
# and rate limiting on auth routes.

upstream app_server {
    server app:3000;
}

# ─── Rate Limiting Zones ──────────────────────────────────────────────────────

# Strict rate limiting for auth endpoints
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

# ─── Server Block (HTTP → HTTPS redirect) ────────────────────────────────────
server {
    listen 80;
    server_name eval.olais.in olais.in;
    return 301 https://$host$request_uri;
}

# ─── Server Block (HTTPS) ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name eval.olais.in;

    # SSL certificates — mounted from host or certbot
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' https:;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ─── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # ─── Static File Caching ─────────────────────────────────────────────
    location /_next/static {
        proxy_pass http://app_server;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static {
        proxy_pass http://app_server;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /favicon.ico {
        proxy_pass http://app_server;
        access_log off;
        expires 30d;
    }

    # ─── Auth Routes (with rate limiting) ────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── General API Routes ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Next.js App Pages ───────────────────────────────────────────────
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Error Pages ─────────────────────────────────────────────────────
    error_page 400 401 402 403 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /500.html;

    location = /429.html {
        internal;
        default_type text/html;
        return 429 '<html><body><h1>429 — Too Many Requests</h1><p>Please slow down and try again later.</p></body></html>';
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
