# Olais Eval — Nginx Reverse Proxy Configuration
# Rate limiting is handled at the application level (proxy.ts middleware).
# Nginx only does pass-through proxying.

upstream app_server {
    server olais-eval-app:3000;
}

server {
    listen 80;
    server_name eval.olais.in olais.in localhost;

    # ─── Error Pages ───────────────────────────────────────────────────
    error_page 502 503 /502.html;
    error_page 429 /429.html;

    location = /429.html {
        root /usr/share/nginx/html;
        internal;
    }

    location = /502.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ─── Security Headers ─────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        application/vnd.ms-fontobject;

    # ─── Static File Caching ─────────────────────────────────────────────
    location /_next/static {
        proxy_pass http://app_server;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static {
        proxy_pass http://app_server;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /favicon.ico {
        proxy_pass http://app_server;
        access_log off;
        expires 30d;
    }

    # ─── MAINTENANCE: Block submissions during update ────────────────────
    location ~ ^/api/candidate/(submit|assessment/submit) {
        return 503;
    }

    # ─── All Routes (pass through) ──────────────────────────────────────
    location / {
        proxy_pass http://app_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
