# Olais Eval — Development Environment
# Usage: docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: olais-eval-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://olais:olais_dev_pass@db:5432/olais_eval
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - olais-network

  db:
    image: postgres:16-alpine
    container_name: olais-eval-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: olais
      POSTGRES_PASSWORD: olais_dev_pass
      POSTGRES_DB: olais_eval
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olais -d olais_eval"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - olais-network

volumes:
  pgdata:
    driver: local

networks:
  olais-network:
    driver: bridge
