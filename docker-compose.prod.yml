# Olais Eval — Production Environment
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: olais-eval-app
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - olais-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/leaderboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: olais-eval-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: always
    networks:
      - olais-network

  db:
    image: postgres:16-alpine
    container_name: olais-eval-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: olais
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: olais_eval
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olais -d olais_eval"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - olais-network

volumes:
  pgdata:
    driver: local
  pgbackup:
    driver: local
  nginx_logs:
    driver: local

networks:
  olais-network:
    driver: bridge
