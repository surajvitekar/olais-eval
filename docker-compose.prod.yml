# Olais Eval — Production Environment
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Database Backups:
#   Backup scripts:    docker/backup/backup.sh, docker/backup/restore.sh
#   Backup volume:     pgbackup:/backup (mounted on db and app containers)
#   Backup schedule (cron on host or container):
#     Daily:   0 2 * * *   root docker exec olais-eval-db bash /app/docker/backup/backup.sh
#     Weekly:  0 2 * * 0   root docker exec olais-eval-db bash /app/docker/backup/backup.sh
#     Monthly: 0 2 1 * *   root docker exec olais-eval-db bash /app/docker/backup/backup.sh
#   Retention: 7 daily, 4 weekly (Sundays), 3 monthly (1st of month)

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: olais-eval-app
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - pgbackup:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - olais-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/leaderboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: olais-eval-nginx
    ports:
      - "3003:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: always
    networks:
      - olais-network

  db:
    image: postgres:16-alpine
    container_name: olais-eval-db
    expose:
      - "5432"
    environment:
      POSTGRES_USER: olais
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: olais_eval
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackup:/backup  # Backup volume for pg_dump output and restore input
      - ./docker/backup:/app/docker/backup:ro  # Backup scripts mounted read-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olais -d olais_eval"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - olais-network

volumes:
  pgdata:
    driver: local
  pgbackup:
    driver: local
  nginx_logs:
    driver: local

networks:
  olais-network:
    driver: bridge
